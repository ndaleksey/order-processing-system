apiVersion: apps/v1
kind: Deployment

metadata:
  name: payment-service

spec:
  replicas: 4

  selector:
    matchLabels:
      app: payment-service

  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
        - name: payment-service
          image: 192.168.56.1:5000/payment-service:8215826
          envFrom:
            - configMapRef:
                name: payment-service-config
            - secretRef:
                name: payment-service-secret